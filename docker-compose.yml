version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: meal_user
      POSTGRES_PASSWORD: meal_password
      POSTGRES_DB: meal_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://meal_user:meal_password@db:5432/meal_db
      POSTGRES_USER: meal_user
      POSTGRES_PASSWORD: meal_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: meal_db
      SECRET_KEY: change-me
      JWT_SECRET_KEY: change-me
      DEFAULT_USER_USERNAME: meal_user
      DEFAULT_USER_PASSWORD: meal_user
      DEFAULT_USER_EMAIL: meal_user@example.com
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:

